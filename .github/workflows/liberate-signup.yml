# Liberar cadastro bloqueado por antifraude (cooldown/rate limit) no Vultr

name: Liberate Signup

on:
  workflow_dispatch:
    inputs:
      email:
        description: E-mail do cadastro a liberar
        required: true
        default: contato@aerosuite.com.br

jobs:
  liberate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VULTR_HOST: ${{ secrets.VULTR_HOST }}
      VULTR_SSH_USER: ${{ secrets.VULTR_SSH_USER }}
      TARGET_EMAIL: ${{ inputs.email }}
    steps:
      - uses: actions/checkout@v4

      - name: Liberar via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          HOST="${VULTR_HOST:-216.238.102.195}"
          USER="${VULTR_SSH_USER:-root}"
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/vultr_deploy
          chmod 600 ~/.ssh/vultr_deploy
          SSH_OPTS="-i ~/.ssh/vultr_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes"

          scp ${SSH_OPTS} scripts/ops/liberate-signup.sh \
            "${USER}@${HOST}:/tmp/liberate-signup.sh"
          ssh ${SSH_OPTS} "${USER}@${HOST}" \
            "chmod +x /tmp/liberate-signup.sh && EMAIL='${TARGET_EMAIL}' INSTALL_DIR=/opt/precisoutapronto bash /tmp/liberate-signup.sh"
