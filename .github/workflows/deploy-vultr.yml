# Deploy manual direto em producao, com validacao antes de alterar o servidor.
name: Deploy Precisou, Tá Pronto Vultr
run-name: Producao - ${{ github.ref_name }} - ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Ambiente de deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      expected_sha:
        description: 'SHA selecionado pelo DeployMaster; impede publicar outro commit'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-vultr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Validar commit e build de producao
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Confirmar SHA solicitado
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${EXPECTED_SHA}" && "${GITHUB_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::A branch mudou. Rode DeployMaster novamente para publicar o commit correto."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run seo:audit
      - run: npm run build
      - name: Validar regras de indicacao e documentos
        run: npx playwright test e2e/referral-growth.spec.ts e2e/shared-document-growth.spec.ts --workers=1

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VULTR_HOST: ${{ secrets.VULTR_HOST }}
      VULTR_SSH_USER: ${{ secrets.VULTR_SSH_USER }}
      DEPLOY_ARCHIVE: precisoutapronto-${{ github.run_id }}-${{ github.run_attempt }}.tgz
      DEPLOY_SCRIPT: precisoutapronto-deploy-${{ github.run_id }}-${{ github.run_attempt }}.sh
    steps:
      - uses: actions/checkout@v4

      - name: Pack repo
        run: |
          tar --exclude=node_modules --exclude=.next --exclude=.git --exclude=.angular \
            --exclude='*.pack' --exclude='.env' --exclude='.env.local' \
            --exclude='.env.production' --exclude='.env.staging' \
            --exclude='test-results' --exclude='playwright-report' --exclude='e2e-agent/artifacts' \
            -czf "/tmp/${DEPLOY_ARCHIVE}" .

      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          HOST="${VULTR_HOST:-216.238.102.195}"
          USER="${VULTR_SSH_USER:-root}"
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/vultr_deploy
          chmod 600 ~/.ssh/vultr_deploy
          SSH_OPTS="-i ~/.ssh/vultr_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          scp ${SSH_OPTS} "/tmp/${DEPLOY_ARCHIVE}" "${USER}@${HOST}:/tmp/${DEPLOY_ARCHIVE}"

          scp ${SSH_OPTS} scripts/deploy/vultr-deploy-precisoutapronto.sh \
            "${USER}@${HOST}:/tmp/${DEPLOY_SCRIPT}"
          ssh ${SSH_OPTS} "${USER}@${HOST}" \
            "chmod +x /tmp/${DEPLOY_SCRIPT} && INSTALL_DIR=/opt/precisoutapronto TARBALL=/tmp/${DEPLOY_ARCHIVE} bash /tmp/${DEPLOY_SCRIPT}; status=\$?; rm -f /tmp/${DEPLOY_ARCHIVE} /tmp/${DEPLOY_SCRIPT}; exit \$status"

  verify:
    name: Verificar producao publicada
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir resposta do site
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 20 --output /dev/null https://precisoutapronto.com.br/; then
              echo "Producao respondeu com sucesso."
              exit 0
            fi
            sleep 5
          done
          echo "::error::O deploy terminou, mas o site nao respondeu com sucesso. Confira o servidor."
          exit 1
