# Deploy Resolva Jato Vultr: produção ou staging (manual)
# Staging: após deploy, roda E2E gate (Playwright bloqueante + UX soft).
# Produção: exige commit status e2e/staging=success nas últimas 24h.

name: Deploy Resolva Jato Vultr

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Ambiente de deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_e2e_gate:
        description: 'Somente emergência: pular checagem E2E ao promover produção'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  statuses: write

jobs:
  require-e2e-for-production:
    name: Require staging E2E before production
    runs-on: ubuntu-latest
    steps:
      - name: Staging deploy does not need prior E2E
        if: ${{ inputs.target == 'staging' }}
        run: echo "Staging deploy: E2E roda depois deste workflow."

      - name: Check e2e/staging commit status
        if: ${{ inputs.target == 'production' && inputs.skip_e2e_gate != true }}
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const maxAgeMs = 24 * 60 * 60 * 1000;
            const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100
            });
            const matches = statuses
              .filter((s) => s.context === 'e2e/staging' && s.state === 'success')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            if (!matches.length) {
              core.setFailed(
                `Sem status e2e/staging=success neste commit (${sha.slice(0,7)}). ` +
                  'Faça deploy de staging e aguarde o E2E Staging Gate passar antes de promover.'
              );
              return;
            }
            const latest = matches[0];
            const age = Date.now() - new Date(latest.created_at).getTime();
            if (age > maxAgeMs) {
              core.setFailed(
                `e2e/staging passou, mas há ${Math.round(age / 3600000)}h (limite 24h). ` +
                  'Rode staging + E2E de novo neste commit.'
              );
              return;
            }
            core.info(`OK: e2e/staging success at ${latest.created_at} (${latest.target_url || 'n/a'})`);

      - name: Emergency skip acknowledged
        if: ${{ inputs.target == 'production' && inputs.skip_e2e_gate == true }}
        run: |
          echo "::warning::skip_e2e_gate=true: promoção sem E2E. Use só em emergência."

  deploy:
    needs: [require-e2e-for-production]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VULTR_HOST: ${{ secrets.VULTR_HOST }}
      VULTR_SSH_USER: ${{ secrets.VULTR_SSH_USER }}
      DEPLOY_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Pack repo
        run: |
          tar --exclude=node_modules --exclude=.next --exclude=.git --exclude=.angular \
            --exclude='*.pack' --exclude='.env' --exclude='.env.local' \
            --exclude='.env.production' --exclude='.env.staging' \
            --exclude='test-results' --exclude='playwright-report' --exclude='e2e-agent/artifacts' \
            -czf /tmp/resolva-jato-repo.tgz .

      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          HOST="${VULTR_HOST:-216.238.102.195}"
          USER="${VULTR_SSH_USER:-root}"
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/vultr_deploy
          chmod 600 ~/.ssh/vultr_deploy
          SSH_OPTS="-i ~/.ssh/vultr_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          scp ${SSH_OPTS} /tmp/resolva-jato-repo.tgz "${USER}@${HOST}:/tmp/resolva-jato-repo.tgz"

          if [[ "${DEPLOY_TARGET}" == "staging" ]]; then
            scp ${SSH_OPTS} scripts/deploy/vultr-deploy-resolvajato-staging.sh \
              "${USER}@${HOST}:/tmp/vultr-deploy-resolvajato-staging.sh"
            ssh ${SSH_OPTS} "${USER}@${HOST}" \
              "chmod +x /tmp/vultr-deploy-resolvajato-staging.sh && INSTALL_DIR=/opt/resolva-jato-staging TARBALL=/tmp/resolva-jato-repo.tgz bash /tmp/vultr-deploy-resolvajato-staging.sh"
          else
            scp ${SSH_OPTS} scripts/deploy/vultr-deploy-resolvajato.sh \
              "${USER}@${HOST}:/tmp/vultr-deploy-resolvajato.sh"
            ssh ${SSH_OPTS} "${USER}@${HOST}" \
              "chmod +x /tmp/vultr-deploy-resolvajato.sh && INSTALL_DIR=/opt/resolva-jato TARBALL=/tmp/resolva-jato-repo.tgz bash /tmp/vultr-deploy-resolvajato.sh"
          fi

  playwright-gate:
    name: Playwright gate
    needs: deploy
    if: ${{ inputs.target == 'staging' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: https://staging.resolvajato.com.br
      E2E_CF_ACCESS_CLIENT_ID: ${{ secrets.E2E_CF_ACCESS_CLIENT_ID }}
      E2E_CF_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Wait for staging to serve
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "CF-Access-Client-Id: ${E2E_CF_ACCESS_CLIENT_ID:-}" \
              -H "CF-Access-Client-Secret: ${E2E_CF_ACCESS_CLIENT_SECRET:-}" \
              "$E2E_BASE_URL/" || true)
            echo "attempt $i -> HTTP $code"
            if [[ "$code" =~ ^(200|301|302|307|308)$ ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Staging did not become ready in time" >&2
          exit 1

      - name: Run Playwright gate
        run: npm run test:e2e:staging

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Publish gate summary
        if: ${{ always() }}
        run: |
          {
            echo "## Playwright staging gate"
            echo ""
            echo "- Base URL: \`$E2E_BASE_URL\`"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  browser-use-ux:
    name: Browser Use UX report
    needs: playwright-gate
    if: ${{ inputs.target == 'staging' && needs.playwright-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      E2E_BASE_URL: https://staging.resolvajato.com.br
      E2E_LLM_API_KEY: ${{ secrets.E2E_LLM_API_KEY }}
      E2E_UX_SOFT: '1'
      E2E_CF_ACCESS_CLIENT_ID: ${{ secrets.E2E_CF_ACCESS_CLIENT_ID }}
      E2E_CF_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e-agent/requirements.txt

      - name: Install agent deps
        run: |
          python -m pip install --upgrade pip
          pip install -r e2e-agent/requirements.txt
          playwright install chromium --with-deps

      - name: Run Browser Use UX agent
        run: python e2e-agent/run_ux_agent.py

      - name: Upload UX report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-report
          path: e2e-agent/artifacts/
          if-no-files-found: ignore

      - name: Publish UX summary
        if: ${{ always() }}
        run: |
          if [[ -f e2e-agent/artifacts/ux-report.md ]]; then
            cat e2e-agent/artifacts/ux-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "UX report missing (agent skipped or failed soft)." >> "$GITHUB_STEP_SUMMARY"
          fi

  mark-e2e-status:
    name: Mark e2e/staging commit status
    needs: [playwright-gate]
    if: ${{ always() && inputs.target == 'staging' && needs.playwright-gate.result != 'cancelled' && needs.playwright-gate.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create commit status
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const gate = '${{ needs.playwright-gate.result }}';
            const state = gate === 'success' ? 'success' : 'failure';
            const description =
              gate === 'success'
                ? 'Playwright staging gate passed'
                : 'Playwright staging gate failed';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'e2e/staging',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.info(`Set e2e/staging=${state} on ${sha}`);
