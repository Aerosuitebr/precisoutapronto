# Deploy manual direto em producao, com validacao antes de alterar o servidor.
name: Deploy Precisou, Tá Pronto Vultr
run-name: Producao - ${{ github.ref_name }} - ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Ambiente de deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      expected_sha:
        description: 'SHA selecionado pelo DeployMaster; impede publicar outro commit'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-vultr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Validar commit e build de producao
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Confirmar SHA solicitado
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${EXPECTED_SHA}" && "${GITHUB_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::A branch mudou. Rode DeployMaster novamente para publicar o commit correto."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run seo:audit
      - run: npm run build
      - name: Validar regras de indicacao e documentos
        run: npx playwright test e2e/referral-growth.spec.ts e2e/shared-document-growth.spec.ts --workers=1

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VULTR_HOST: ${{ secrets.VULTR_HOST }}
      VULTR_SSH_USER: ${{ secrets.VULTR_SSH_USER }}
      DEPLOY_ARCHIVE: precisoutapronto-${{ github.run_id }}-${{ github.run_attempt }}.tgz
    steps:
      - uses: actions/checkout@v4

      - name: Pack repo
        run: |
          tar --exclude=node_modules --exclude=.next --exclude=.git --exclude=.angular \
            --exclude='*.pack' --exclude='.env' --exclude='.env.local' \
            --exclude='.env.production' --exclude='.env.staging' \
            --exclude='test-results' --exclude='playwright-report' --exclude='e2e-agent/artifacts' \
            --exclude='./docs/divulgacao' --exclude='./reports' --exclude='./output' \
            -czf "/tmp/${DEPLOY_ARCHIVE}" .
          du -h "/tmp/${DEPLOY_ARCHIVE}"

      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          HOST="${VULTR_HOST:-216.238.102.195}"
          USER="${VULTR_SSH_USER:-root}"
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/vultr_deploy
          chmod 600 ~/.ssh/vultr_deploy
          SSH_OPTS=(-T -i ~/.ssh/vultr_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          TARGET="${USER}@${HOST}"
          ARCHIVE="/tmp/${DEPLOY_ARCHIVE}"
          CHECKSUM=$(sha256sum "${ARCHIVE}")
          CHECKSUM=${CHECKSUM%% *}
          ARCHIVE_BYTES=$(wc -c < "${ARCHIVE}")

          echo "==> Validar sessao SSH e espaco em /tmp"
          if ! timeout 60 ssh "${SSH_OPTS[@]}" "${TARGET}" \
            "set -eu; test -w /tmp; available=\$(df -Pk /tmp | awk 'END { print \$4 }'); test \"\$available\" -gt '$(( (ARCHIVE_BYTES + 1023) / 1024 ))'; echo 'Sessao SSH e espaco em /tmp confirmados'" \
            </dev/null; then
            echo "::error::Falha na verificacao SSH ou espaco insuficiente em /tmp no Vultr."
            exit 1
          fi

          # Transfere pelo canal SSH sem depender do subsistema SFTP.
          for attempt in 1 2; do
            echo "==> Enviar ${ARCHIVE_BYTES} bytes (tentativa ${attempt}/2, limite: 8 minutos)"
            if timeout 480 ssh "${SSH_OPTS[@]}" "${TARGET}" \
              "set -eu; umask 077; echo 'Recebendo pacote no Vultr'; dd of='${ARCHIVE}.part' bs=128K status=progress; echo 'Validando SHA-256'; printf '%s  %s\n' '${CHECKSUM}' '${ARCHIVE}.part' | sha256sum -c -; mv -f '${ARCHIVE}.part' '${ARCHIVE}'" \
              < "${ARCHIVE}"; then
              break
            else
              status=$?
              timeout 30 ssh "${SSH_OPTS[@]}" "${TARGET}" "rm -f '${ARCHIVE}.part' '${ARCHIVE}'" </dev/null || true
              if [[ "${attempt}" == 2 ]]; then
                echo "::error::Nao foi possivel enviar e verificar o pacote no Vultr (codigo ${status})."
                exit "${status}"
              fi
            fi
          done

          echo "==> Executar publicacao no servidor"
          ssh "${SSH_OPTS[@]}" "${TARGET}" \
            "umask 077; trap 'rm -f \"${ARCHIVE}\" \"${ARCHIVE}.sh\"' EXIT; tar -xOzf '${ARCHIVE}' ./scripts/deploy/vultr-deploy-precisoutapronto.sh > '${ARCHIVE}.sh' && INSTALL_DIR=/opt/precisoutapronto TARBALL='${ARCHIVE}' bash '${ARCHIVE}.sh'" </dev/null

  verify:
    name: Verificar producao publicada
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir resposta do site
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 20 --output /dev/null https://precisoutapronto.com.br/; then
              echo "Producao respondeu com sucesso."
              exit 0
            fi
            sleep 5
          done
          echo "::error::O deploy terminou, mas o site nao respondeu com sucesso. Confira o servidor."
          exit 1
