# Enviar nudge de indicação (3 amigos = Premium) aos usuários verificados

name: Nudge Referral Emails

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = só lista, 0 = envia e-mails'
        required: true
        default: '1'
      limit:
        description: Máximo de usuários
        required: true
        default: '200'

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VULTR_HOST: ${{ secrets.VULTR_HOST }}
      VULTR_SSH_USER: ${{ secrets.VULTR_SSH_USER }}
      DRY_RUN: ${{ inputs.dry_run }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4

      - name: Rodar no Vultr (container app)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          HOST="${VULTR_HOST:-216.238.102.195}"
          USER="${VULTR_SSH_USER:-root}"
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/vultr_deploy
          chmod 600 ~/.ssh/vultr_deploy
          SSH_OPTS="-i ~/.ssh/vultr_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes"

          scp ${SSH_OPTS} scripts/ops/nudge-referral-emails.cjs \
            "${USER}@${HOST}:/tmp/nudge-referral-emails.cjs"

          ssh ${SSH_OPTS} "${USER}@${HOST}" bash -s <<EOF
          set -euo pipefail
          cd /opt/resolva-jato
          set -a
          # shellcheck disable=SC1091
          source .env.production
          set +a
          docker cp /tmp/nudge-referral-emails.cjs resolva-jato-app:/app/nudge-referral-emails.cjs
          docker exec -u root resolva-jato-app chown nextjs:nodejs /app/nudge-referral-emails.cjs
          docker exec -w /app \
            -e DRY_RUN='${DRY_RUN}' \
            -e LIMIT='${LIMIT}' \
            -e RESEND_API_KEY \
            -e RESEND_FROM \
            -e SMTP_HOST \
            -e SMTP_PORT \
            -e SMTP_USER \
            -e SMTP_PASS \
            -e SMTP_FROM \
            -e SMTP_SSL \
            -e SMTP_START_TLS \
            -e NEXT_PUBLIC_APP_URL \
            resolva-jato-app \
            node /app/nudge-referral-emails.cjs
          docker exec -u root resolva-jato-app rm -f /app/nudge-referral-emails.cjs || true
          rm -f /tmp/nudge-referral-emails.cjs
          EOF
