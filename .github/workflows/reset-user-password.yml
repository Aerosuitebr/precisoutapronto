# Redefinir senha de usuário no Vultr

name: Reset User Password

on:
  workflow_dispatch:
    inputs:
      email:
        description: E-mail da conta
        required: true
      password_hash:
        description: Hash scrypt$salt$hash (não envie a senha em texto)
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VULTR_HOST: ${{ secrets.VULTR_HOST }}
      VULTR_SSH_USER: ${{ secrets.VULTR_SSH_USER }}
      TARGET_EMAIL: ${{ inputs.email }}
      TARGET_HASH: ${{ inputs.password_hash }}
    steps:
      - uses: actions/checkout@v4

      - name: Reset via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          HOST="${VULTR_HOST:-216.238.102.195}"
          USER="${VULTR_SSH_USER:-root}"
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/vultr_deploy
          chmod 600 ~/.ssh/vultr_deploy
          SSH_OPTS="-i ~/.ssh/vultr_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes"

          scp ${SSH_OPTS} scripts/ops/reset-user-password.sh \
            "${USER}@${HOST}:/tmp/reset-user-password.sh"

          # Envia hash por arquivo para não interpolar $ no remote shell
          printf '%s' "${TARGET_HASH}" > /tmp/rj-password.hash
          scp ${SSH_OPTS} /tmp/rj-password.hash "${USER}@${HOST}:/tmp/rj-password.hash"
          rm -f /tmp/rj-password.hash

          ssh ${SSH_OPTS} "${USER}@${HOST}" \
            "chmod +x /tmp/reset-user-password.sh && EMAIL='${TARGET_EMAIL}' PASSWORD_HASH=\"\$(cat /tmp/rj-password.hash)\" INSTALL_DIR=/opt/resolva-jato bash /tmp/reset-user-password.sh && rm -f /tmp/rj-password.hash /tmp/reset-user-password.sh"
