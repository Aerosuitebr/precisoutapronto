# E2E Staging Gate (manual): Playwright + Browser Use UX
# Também roda automaticamente após deploy staging (jobs no deploy-vultr.yml).

name: E2E Staging Gate

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Staging base URL
        type: string
        required: false
        default: 'https://staging.precisoutapronto.com.br'

permissions:
  contents: read
  statuses: write

jobs:
  playwright-gate:
    name: Playwright gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_CF_ACCESS_CLIENT_ID: ${{ secrets.E2E_CF_ACCESS_CLIENT_ID }}
      E2E_CF_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Wait for staging to serve
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "CF-Access-Client-Id: ${E2E_CF_ACCESS_CLIENT_ID:-}" \
              -H "CF-Access-Client-Secret: ${E2E_CF_ACCESS_CLIENT_SECRET:-}" \
              "$E2E_BASE_URL/" || true)
            echo "attempt $i -> HTTP $code"
            if [[ "$code" =~ ^(200|301|302|307|308)$ ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Staging did not become ready in time" >&2
          exit 1

      - name: Run Playwright gate
        run: npm run test:e2e:staging

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  browser-use-ux:
    name: Browser Use UX report
    needs: playwright-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_LLM_API_KEY: ${{ secrets.E2E_LLM_API_KEY }}
      E2E_UX_SOFT: '1'
      E2E_CF_ACCESS_CLIENT_ID: ${{ secrets.E2E_CF_ACCESS_CLIENT_ID }}
      E2E_CF_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e-agent/requirements.txt

      - name: Install agent deps
        run: |
          python -m pip install --upgrade pip
          pip install -r e2e-agent/requirements.txt
          playwright install chromium --with-deps

      - name: Run Browser Use UX agent
        run: python e2e-agent/run_ux_agent.py

      - name: Upload UX report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-report
          path: e2e-agent/artifacts/
          if-no-files-found: ignore

  mark-commit-status:
    name: Mark e2e/staging commit status
    needs: [playwright-gate]
    if: ${{ always() && needs.playwright-gate.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create commit status
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const gate = '${{ needs.playwright-gate.result }}';
            const state = gate === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'e2e/staging',
              description: gate === 'success' ? 'Playwright staging gate passed' : 'Playwright staging gate failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
