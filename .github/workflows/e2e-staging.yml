# E2E Staging Gate: Playwright (bloqueante) + Browser Use UX (soft)
name: E2E Staging Gate

on:
  workflow_call:
    inputs:
      base_url:
        description: Staging base URL
        type: string
        required: false
        default: 'https://staging.resolvajato.com.br'
      git_sha:
        description: Commit SHA to annotate with e2e/staging status
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      base_url:
        description: Staging base URL
        type: string
        required: false
        default: 'https://staging.resolvajato.com.br'

permissions:
  contents: read
  statuses: write
  actions: read

jobs:
  playwright-gate:
    name: Playwright gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://staging.resolvajato.com.br' }}
      E2E_CF_ACCESS_CLIENT_ID: ${{ secrets.E2E_CF_ACCESS_CLIENT_ID }}
      E2E_CF_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Wait for staging to serve
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "CF-Access-Client-Id: ${E2E_CF_ACCESS_CLIENT_ID:-}" \
              -H "CF-Access-Client-Secret: ${E2E_CF_ACCESS_CLIENT_SECRET:-}" \
              "$E2E_BASE_URL/" || true)
            echo "attempt $i -> HTTP $code"
            if [[ "$code" =~ ^(200|301|302|307|308)$ ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Staging did not become ready in time" >&2
          exit 1

      - name: Run Playwright gate
        run: npm run test:e2e:staging

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Publish gate summary
        if: always()
        run: |
          {
            echo "## Playwright staging gate"
            echo ""
            echo "- Base URL: \`$E2E_BASE_URL\`"
            echo "- Result: **${{ job.status }}**"
            echo ""
            echo "Artifacts: \`playwright-report\` (HTML) and \`test-results\` (traces/screenshots)."
          } >> "$GITHUB_STEP_SUMMARY"

  browser-use-ux:
    name: Browser Use UX report
    needs: playwright-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://staging.resolvajato.com.br' }}
      E2E_LLM_API_KEY: ${{ secrets.E2E_LLM_API_KEY }}
      E2E_UX_SOFT: '1'
      E2E_CF_ACCESS_CLIENT_ID: ${{ secrets.E2E_CF_ACCESS_CLIENT_ID }}
      E2E_CF_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e-agent/requirements.txt

      - name: Install agent deps
        run: |
          python -m pip install --upgrade pip
          pip install -r e2e-agent/requirements.txt
          playwright install chromium --with-deps

      - name: Run Browser Use UX agent
        run: python e2e-agent/run_ux_agent.py

      - name: Upload UX report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-report
          path: e2e-agent/artifacts/
          if-no-files-found: ignore

      - name: Publish UX summary
        if: always()
        run: |
          if [[ -f e2e-agent/artifacts/ux-report.md ]]; then
            cat e2e-agent/artifacts/ux-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "UX report missing (agent skipped or failed soft)." >> "$GITHUB_STEP_SUMMARY"
          fi

  mark-commit-status:
    name: Mark e2e/staging commit status
    needs: [playwright-gate]
    if: always() && needs.playwright-gate.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Create commit status
        uses: actions/github-script@v7
        with:
          script: |
            const sha =
              '${{ inputs.git_sha }}' ||
              context.payload.workflow_run?.head_sha ||
              context.sha;
            const gate = '${{ needs.playwright-gate.result }}';
            const state = gate === 'success' ? 'success' : 'failure';
            const description =
              gate === 'success'
                ? 'Playwright staging gate passed'
                : 'Playwright staging gate failed';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'e2e/staging',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.info(`Set e2e/staging=${state} on ${sha}`);
