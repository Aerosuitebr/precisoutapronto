# Stack de produção — Precisou, Tá Pronto
# App (Next.js) + PostgreSQL + Caddy (HTTPS) + Evolution/WhatsApp
#
# Pré-requisitos:
#   1. DNS de DOMAIN apontando para este servidor
#   2. Copiar .env.production.example → .env e preencher
#   3. docker compose up -d --build
#
# Ver DOCKER.md para o passo a passo completo.

name: precisoutapronto

services:
  postgres:
    image: postgres:16-alpine
    container_name: precisoutapronto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-precisoutapronto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-precisoutapronto}
    volumes:
      - precisoutapronto_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-precisoutapronto} -d ${POSTGRES_DB:-precisoutapronto}'
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - precisoutapronto_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://precisoutapronto.com.br}
        NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: ${NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_CLARITY_PROJECT_ID: ${NEXT_PUBLIC_CLARITY_PROJECT_ID:-xsknm22mhw}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
    container_name: precisoutapronto-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      precisoutapronto-evolution-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      PRISMA_SCHEMA_MODE: ${PRISMA_SCHEMA_MODE:-push}
      DATABASE_URL: postgresql://${POSTGRES_USER:-precisoutapronto}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-precisoutapronto}?schema=public
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://precisoutapronto.com.br}
      DOCUMENT_AI_ENDPOINT: ${DOCUMENT_AI_ENDPOINT:-}
      DOCUMENT_AI_API_KEY: ${DOCUMENT_AI_API_KEY:-}
      NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: ${NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_PRICE_PREMIUM: ${STRIPE_PRICE_PREMIUM:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ASAAS_MODE: ${ASAAS_MODE:-sandbox}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      NUPAY_MODE: ${NUPAY_MODE:-sandbox}
      NUPAY_APP_KEY: ${NUPAY_APP_KEY:-}
      NUPAY_APP_TOKEN: ${NUPAY_APP_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_START_TLS: ${SMTP_START_TLS:-REQUIRED}
      AUTH_SECRET: ${AUTH_SECRET:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-evolution}
      WHATSAPP_API_ENABLED: ${WHATSAPP_API_ENABLED:-true}
      EVOLUTION_API_URL: http://precisoutapronto-evolution-api:8080
      WHATSAPP_API_URL: http://precisoutapronto-evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY no .env}
      WHATSAPP_API_TOKEN: ${EVOLUTION_API_KEY}
      WHATSAPP_INSTANCE: ${WHATSAPP_INSTANCE:-precisoutapronto}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_CLARITY_PROJECT_ID: ${NEXT_PUBLIC_CLARITY_PROJECT_ID:-xsknm22mhw}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contato@precisoutapronto.com.br}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - precisoutapronto_net

  caddy:
    image: caddy:2-alpine
    container_name: precisoutapronto-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-precisoutapronto.com.br}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - precisoutapronto_caddy_data:/data
      - precisoutapronto_caddy_config:/config
    networks:
      - precisoutapronto_net

  precisoutapronto-evolution-postgres:
    image: postgres:15-alpine
    container_name: precisoutapronto-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution}
      POSTGRES_DB: evolution
    volumes:
      - precisoutapronto_evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution -d evolution']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - precisoutapronto_net

  precisoutapronto-evolution-redis:
    image: redis:7-alpine
    container_name: precisoutapronto-evolution-redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - precisoutapronto_net

  precisoutapronto-evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: precisoutapronto-evolution-api
    restart: unless-stopped
    depends_on:
      precisoutapronto-evolution-postgres:
        condition: service_healthy
      precisoutapronto-evolution-redis:
        condition: service_healthy
    # Só no localhost do host — não publicar na internet
    ports:
      - '127.0.0.1:18083:8080'
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://127.0.0.1:18083}
      SERVER_PORT: '8080'
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY no .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'true'
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution}@precisoutapronto-evolution-postgres:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://precisoutapronto-evolution-redis:6379/1
      CACHE_REDIS_PREFIX_KEY: precisoutapronto-evolution
      CACHE_LOCAL_ENABLED: 'false'
      LOG_LEVEL: ERROR,WARN,INFO
      DEL_INSTANCE: 'false'
      CONFIG_SESSION_PHONE_VERSION: '2.3000.1025062854'
    volumes:
      - precisoutapronto_evolution_instances:/evolution/instances
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8080/']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - precisoutapronto_net

volumes:
  precisoutapronto_postgres:
  precisoutapronto_caddy_data:
  precisoutapronto_caddy_config:
  precisoutapronto_evolution_postgres:
  precisoutapronto_evolution_instances:

networks:
  precisoutapronto_net:
    driver: bridge
